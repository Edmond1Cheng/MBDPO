name: mbdpo-jax
channels:
  - nvidia
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - numpy>=2,<3
  - pyyaml
  - scipy
  - pip:
      - "jax[cuda12]==0.7.1"
      - optax
      - dm-control==1.0.16
      - gymnasium==0.29.1
      - hydra-core==1.3.2
      - hydra-submitit-launcher==1.2.0
      - termcolor==2.4.0
      - mujoco==3.1.2
      - imageio==2.34.1
      - imageio-ffmpeg==0.4.9
      - pandas>=2.2
      - matplotlib>=3.9
      - protobuf<6
      - wandb==0.17.4
      # The verified felis GPU environment uses jax/jaxlib 0.7.1 and needs cuDNN >= 9.8.
      - nvidia-cudnn-cu12==9.8.0.87
